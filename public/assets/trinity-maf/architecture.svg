<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/>
    </marker>
    <linearGradient id="mafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="530" fill="#fafbff" rx="12"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b4b" letter-spacing="-0.3">TRINITY-MAF Architecture</text>
  <text x="450" y="50" text-anchor="middle" font-size="10" fill="#6366f1" letter-spacing="2" font-weight="500">AUD PLATFORM · REVERSE PROXY BACKEND</text>

  <!-- Legend -->
  <rect x="630" y="62" width="240" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
  <line x1="648" y1="76" x2="668" y2="76" stroke="#94a3b8" stroke-width="2"/>
  <text x="674" y="80" font-size="9" fill="#64748b" font-weight="500">HTTP</text>
  <line x1="718" y1="76" x2="738" y2="76" stroke="#fb923c" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="744" y="80" font-size="9" fill="#ea580c" font-weight="500">WebSocket</text>
  <line x1="808" y1="76" x2="828" y2="76" stroke="#34d399" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="834" y="80" font-size="9" fill="#059669" font-weight="500">SSE</text>

  <!-- Client -->
  <rect x="310" y="72" width="270" height="42" rx="21" fill="#eef2ff" stroke="#c7d2fe" filter="url(#shadow)"/>
  <text x="445" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#4338ca">Browser  (HTTP / WS / SSE)</text>

  <!-- Arrow: Client → Web Server -->
  <line x1="445" y1="114" x2="445" y2="142" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Web Server -->
  <rect x="255" y="148" width="390" height="34" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="450" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#a16207">고객사 Web Server  (nginx / Apache)</text>

  <!-- Arrow: Web Server → MAF -->
  <line x1="450" y1="182" x2="450" y2="212" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MAF -->
  <rect x="190" y="218" width="520" height="80" rx="10" fill="url(#mafGrad)" filter="url(#shadow)"/>
  <text x="450" y="247" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" letter-spacing="-0.2">TRINITY-MAF</text>
  <text x="450" y="266" text-anchor="middle" font-size="10" fill="#a5b4fc">URI Routing · HTTP Proxy · SSE Flush · WS Bridge · Superset Session</text>
  <text x="450" y="283" text-anchor="middle" font-size="9" fill="#818cf8">Servlet Filter · Tomcat 9+ / JEUS · WEB-INF/lib 배포</text>

  <!-- /trinity/* → Designer -->
  <line x1="295" y1="298" x2="145" y2="358" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="188" y="328" font-size="10" font-weight="600" fill="#64748b">/trinity/*</text>

  <!-- /agent/* (WS) -->
  <line x1="415" y1="298" x2="415" y2="358" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arro)"/>
  <text x="398" y="336" font-size="9" font-weight="600" fill="#ea580c">WS</text>

  <!-- /agent/* (SSE) -->
  <line x1="485" y1="298" x2="485" y2="358" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrg)"/>
  <text x="497" y="336" font-size="9" font-weight="600" fill="#059669">SSE</text>

  <!-- /agent/* label -->
  <text x="450" y="316" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">/agent/*</text>

  <!-- /visual/* → Superset -->
  <line x1="605" y1="298" x2="755" y2="358" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="712" y="328" font-size="10" font-weight="600" fill="#64748b">/visual/*</text>

  <!-- Backend: Designer -->
  <rect x="45" y="362" width="210" height="58" rx="8" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <rect x="45" y="362" width="210" height="4" rx="2" fill="#818cf8"/>
  <text x="150" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1b4b">TRINITY Designer</text>
  <text x="150" y="405" text-anchor="middle" font-size="10" fill="#6b7280">Langflow · Ontology Designer</text>

  <!-- Backend: Portal -->
  <rect x="335" y="362" width="230" height="58" rx="8" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <rect x="335" y="362" width="230" height="4" rx="2" fill="#818cf8"/>
  <text x="450" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1b4b">TRINITY Portal / Agent</text>
  <text x="450" y="405" text-anchor="middle" font-size="10" fill="#6b7280">OpenWebUI · Socket.IO · SSE</text>

  <!-- Backend: Superset -->
  <rect x="650" y="362" width="210" height="58" rx="8" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <rect x="650" y="362" width="210" height="4" rx="2" fill="#818cf8"/>
  <text x="755" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1b4b">Apache Superset</text>
  <text x="755" y="405" text-anchor="middle" font-size="10" fill="#6b7280">자동 세션 · CSRF 관리</text>

  <!-- Arrow: Portal → LLM -->
  <line x1="450" y1="420" x2="450" y2="455" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrg)"/>

  <!-- LLM -->
  <rect x="305" y="460" width="290" height="52" rx="8" fill="#ecfdf5" stroke="#a7f3d0" filter="url(#shadow)"/>
  <rect x="305" y="460" width="290" height="4" rx="2" fill="#34d399"/>
  <text x="450" y="484" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Langflow → LLM</text>
  <text x="450" y="500" text-anchor="middle" font-size="10" fill="#047857">온프레미스 GPU · SSE token streaming</text>
</svg>
