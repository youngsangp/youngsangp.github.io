<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="facadeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="720" fill="#f8fafc"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Trinity-MAF · Multi-protocol Application Facade</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#64748b">단일 게이트웨이로 HTTP · WebSocket · 이기종 백엔드를 통합하는 리버스 프록시</text>

  <!-- Client layer -->
  <rect x="60" y="95" width="980" height="80" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="120" font-size="13" font-weight="700" fill="#334155">Client</text>
  <rect x="80" y="132" width="180" height="32" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="170" y="152" text-anchor="middle" font-size="12" fill="#1e40af">Browser (HTTP / WS)</text>
  <rect x="280" y="132" width="180" height="32" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="370" y="152" text-anchor="middle" font-size="12" fill="#1e40af">Trinity Designer UI</text>
  <rect x="480" y="132" width="180" height="32" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="570" y="152" text-anchor="middle" font-size="12" fill="#1e40af">Agent Console</text>
  <rect x="680" y="132" width="180" height="32" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="770" y="152" text-anchor="middle" font-size="12" fill="#1e40af">Embedded Superset</text>

  <!-- Customer infra layer -->
  <rect x="60" y="200" width="980" height="52" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-dasharray="5,3"/>
  <text x="80" y="222" font-size="12" font-weight="700" fill="#92400e">고객사 Web Server / Reverse Proxy</text>
  <text x="80" y="240" font-size="11" fill="#92400e">nginx · Apache · 방화벽 (Upgrade / Connection 헤더 유지 필요)</text>

  <!-- Facade -->
  <rect x="200" y="285" width="700" height="160" rx="10" fill="url(#facadeGrad)" stroke="#1e3a8a"/>
  <text x="550" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Trinity-MAF (Servlet Filter · Tomcat 9+ / Jakarta EE)</text>

  <rect x="220" y="328" width="200" height="46" rx="4" fill="#3b82f6" opacity="0.9"/>
  <text x="320" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">ReverseProxyFilter</text>
  <text x="320" y="364" text-anchor="middle" font-size="10" fill="#dbeafe">URI routing · 정적리소스 bypass</text>

  <rect x="440" y="328" width="200" height="46" rx="4" fill="#3b82f6" opacity="0.9"/>
  <text x="540" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">HttpProxyClient</text>
  <text x="540" y="364" text-anchor="middle" font-size="10" fill="#dbeafe">Apache HttpClient 5 · Location rewrite</text>

  <rect x="660" y="328" width="220" height="46" rx="4" fill="#3b82f6" opacity="0.9"/>
  <text x="770" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Socket.IO WS Bridge</text>
  <text x="770" y="364" text-anchor="middle" font-size="10" fill="#dbeafe">양방향 큐 · AtomicBoolean 직렬화</text>

  <rect x="220" y="384" width="310" height="46" rx="4" fill="#60a5fa" opacity="0.9"/>
  <text x="375" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">SupersetSessionManager</text>
  <text x="375" y="420" text-anchor="middle" font-size="10" fill="#dbeafe">공통계정 자동로그인 · CSRF · 30분 TTL 캐시</text>

  <rect x="550" y="384" width="330" height="46" rx="4" fill="#60a5fa" opacity="0.9"/>
  <text x="715" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">WsEndpointCheckListener · ProxyRoute</text>
  <text x="715" y="420" text-anchor="middle" font-size="10" fill="#dbeafe">Tomcat/JEUS 호환 · 세그먼트 경계 검증</text>

  <!-- Arrows from clients to facade -->
  <line x1="170" y1="164" x2="170" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrblue)"/>
  <line x1="370" y1="164" x2="370" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrblue)"/>
  <line x1="570" y1="164" x2="570" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrblue)"/>
  <line x1="770" y1="164" x2="770" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrblue)"/>

  <line x1="550" y1="252" x2="550" y2="285" stroke="#2563eb" stroke-width="2" marker-end="url(#arrblue)"/>

  <!-- Routes to backends -->
  <line x1="300" y1="445" x2="180" y2="530" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="210" y="490" font-size="11" font-weight="600" fill="#475569">/trinity/*</text>

  <line x1="520" y1="445" x2="520" y2="530" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="525" y="490" font-size="11" font-weight="600" fill="#475569">/agent/*</text>

  <line x1="780" y1="445" x2="880" y2="530" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="820" y="490" font-size="11" font-weight="600" fill="#475569">/visual/*</text>

  <!-- Backend layer -->
  <rect x="80" y="535" width="260" height="100" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="210" y="558" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Trinity Designer</text>
  <text x="210" y="578" text-anchor="middle" font-size="11" fill="#64748b">Langflow · Ontology Designer</text>
  <text x="210" y="595" text-anchor="middle" font-size="11" fill="#64748b">FastAPI · React</text>
  <text x="210" y="615" text-anchor="middle" font-size="10" fill="#94a3b8">HTTP + WebSocket</text>

  <rect x="390" y="535" width="260" height="100" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="520" y="558" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Trinity Portal / Agent</text>
  <text x="520" y="578" text-anchor="middle" font-size="11" fill="#64748b">LLM Agent Runtime</text>
  <text x="520" y="595" text-anchor="middle" font-size="11" fill="#64748b">Socket.IO 스트리밍</text>
  <text x="520" y="615" text-anchor="middle" font-size="10" fill="#94a3b8">HTTP + WebSocket</text>

  <rect x="700" y="535" width="260" height="100" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="830" y="558" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Apache Superset</text>
  <text x="830" y="578" text-anchor="middle" font-size="11" fill="#64748b">데이터 시각화 대시보드</text>
  <text x="830" y="595" text-anchor="middle" font-size="11" fill="#64748b">세션 쿠키 · CSRF 필요</text>
  <text x="830" y="615" text-anchor="middle" font-size="10" fill="#94a3b8">HTTP</text>

  <!-- Config layer -->
  <rect x="60" y="660" width="980" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="80" y="685" font-size="11" font-weight="700" fill="#475569">Configuration</text>
  <text x="180" y="685" font-size="11" fill="#64748b">XMatrix.getRepOption() · TRINITY_*_URL · connect/response timeout · WS buffer(10MB) / idle(600s)</text>
</svg>
