<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="'Pretendard', 'Inter', -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="720" fill="#fafafa"/>

  <!-- ============ User Input ============ -->
  <g transform="translate(60, 30)">
    <rect x="0" y="0" width="880" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="20" y="28" font-size="11" font-weight="700" fill="#334155" letter-spacing="1.5">사용자 입력</text>
    <text x="20" y="52" font-size="15" font-weight="600" fill="#0f172a">"작년 3분기 서울지역 매출 Top 10 부서 보여줘"</text>
  </g>

  <!-- Arrow down -->
  <line x1="500" y1="100" x2="500" y2="130" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-pipeline)"/>

  <!-- ============ Pipeline (5 Stages) ============ -->
  <rect x="60" y="135" width="880" height="220" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="80" y="160" font-size="11" font-weight="700" fill="#334155" letter-spacing="1.5">G-MATRIX 파이프라인</text>

  <!-- Stage 1: 전처리 -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="155" height="155" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="22" font-size="10" font-weight="700" fill="#991b1b">STEP 1</text>
    <text x="12" y="42" font-size="14" font-weight="700" fill="#0f172a">전처리</text>
    <line x1="12" y1="52" x2="143" y2="52" stroke="#fecaca" stroke-width="1"/>
    <text x="12" y="72" font-size="11" fill="#475569">· 한글 숫자 변환</text>
    <text x="12" y="90" font-size="11" fill="#475569">· 약어 정규화</text>
    <text x="12" y="108" font-size="11" fill="#475569">· 시간 표현 처리</text>
    <text x="12" y="126" font-size="11" fill="#475569">· 키워드 추출</text>
    <text x="12" y="148" font-size="9" font-style="italic" fill="#94a3b8">TextConverter</text>
  </g>

  <!-- Arrow -->
  <line x1="240" y1="257" x2="263" y2="257" stroke="#475569" stroke-width="2" marker-end="url(#arrow-pipeline)"/>

  <!-- Stage 2: 하이브리드 검색 -->
  <g transform="translate(265, 180)">
    <rect x="0" y="0" width="155" height="155" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="12" y="22" font-size="10" font-weight="700" fill="#854d0e">STEP 2</text>
    <text x="12" y="42" font-size="14" font-weight="700" fill="#0f172a">하이브리드 검색</text>
    <line x1="12" y1="52" x2="143" y2="52" stroke="#fde68a" stroke-width="1"/>
    <text x="12" y="72" font-size="11" fill="#475569">· Embedding</text>
    <text x="12" y="90" font-size="11" fill="#475569">· InvertedIndex</text>
    <text x="12" y="108" font-size="11" fill="#475569">· 결과 병합 + 랭킹</text>
    <text x="12" y="126" font-size="11" fill="#475569">· reportcode 필터</text>
    <text x="12" y="148" font-size="9" font-style="italic" fill="#94a3b8">GMatrixVectorStore</text>
  </g>

  <!-- Arrow -->
  <line x1="425" y1="257" x2="448" y2="257" stroke="#475569" stroke-width="2" marker-end="url(#arrow-pipeline)"/>

  <!-- Stage 3: GUI 구조화 -->
  <g transform="translate(450, 180)">
    <rect x="0" y="0" width="155" height="155" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="12" y="22" font-size="10" font-weight="700" fill="#065f46">STEP 3</text>
    <text x="12" y="42" font-size="14" font-weight="700" fill="#0f172a">GUI 구조화</text>
    <line x1="12" y1="52" x2="143" y2="52" stroke="#a7f3d0" stroke-width="1"/>
    <text x="12" y="72" font-size="11" fill="#475569">· dimension 정리</text>
    <text x="12" y="90" font-size="11" fill="#475569">· measure 정리</text>
    <text x="12" y="108" font-size="11" fill="#475569">· filter 정리</text>
    <text x="12" y="126" font-size="11" fill="#475569">· 정규화</text>
    <text x="12" y="148" font-size="9" font-style="italic" fill="#94a3b8">gui.py</text>
  </g>

  <!-- Arrow -->
  <line x1="610" y1="257" x2="633" y2="257" stroke="#475569" stroke-width="2" marker-end="url(#arrow-pipeline)"/>

  <!-- Stage 4: JSON IR 빌드 -->
  <g transform="translate(635, 180)">
    <rect x="0" y="0" width="155" height="155" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="12" y="22" font-size="10" font-weight="700" fill="#1e3a8a">STEP 4</text>
    <text x="12" y="42" font-size="14" font-weight="700" fill="#0f172a">JSON IR 빌드</text>
    <line x1="12" y1="52" x2="143" y2="52" stroke="#bfdbfe" stroke-width="1"/>
    <text x="12" y="72" font-size="11" fill="#475569">· LLM 호출</text>
    <text x="12" y="90" font-size="11" fill="#475569">· JSON 중간표현</text>
    <text x="12" y="108" font-size="11" fill="#475569">· 스키마 검증</text>
    <text x="12" y="126" font-size="11" fill="#475569">· 멀티뷰 merge</text>
    <text x="12" y="148" font-size="9" font-style="italic" fill="#94a3b8">JsonBuilder</text>
  </g>

  <!-- Arrow -->
  <line x1="795" y1="257" x2="818" y2="257" stroke="#475569" stroke-width="2" marker-end="url(#arrow-pipeline)"/>

  <!-- Stage 5: Dual SQL 생성 -->
  <g transform="translate(820, 180)">
    <rect x="0" y="0" width="100" height="155" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="22" font-size="10" font-weight="700" fill="#5b21b6">STEP 5</text>
    <text x="12" y="42" font-size="13" font-weight="700" fill="#0f172a">SQL 생성</text>
    <line x1="12" y1="52" x2="88" y2="52" stroke="#ddd6fe" stroke-width="1"/>
    <text x="12" y="72" font-size="11" font-weight="600" fill="#475569">Dual Path</text>
    <text x="12" y="90" font-size="10" fill="#64748b">· AUD 템플릿</text>
    <text x="12" y="105" font-size="10" fill="#64748b">  바인딩</text>
    <text x="12" y="122" font-size="10" fill="#64748b">· META 동적</text>
    <text x="12" y="137" font-size="10" fill="#64748b">  생성</text>
    <text x="12" y="150" font-size="9" font-style="italic" fill="#94a3b8">METASQL</text>
  </g>

  <!-- Arrow down to External -->
  <line x1="500" y1="355" x2="500" y2="395" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-pipeline)"/>

  <!-- ============ Multi-Agent Layer ============ -->
  <g transform="translate(60, 400)">
    <rect x="0" y="0" width="880" height="100" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="20" y="25" font-size="11" font-weight="700" fill="#334155" letter-spacing="1.5">멀티 에이전트 라우팅</text>

    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="115" height="42" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="57" y="18" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">agent_router</text>
      <text x="57" y="33" font-size="9" text-anchor="middle" fill="#94a3b8">의도 분류</text>
    </g>

    <g transform="translate(145, 40)">
      <rect x="0" y="0" width="115" height="42" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="57" y="18" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">retrieve_agent</text>
      <text x="57" y="33" font-size="9" text-anchor="middle" fill="#94a3b8">데이터 검색</text>
    </g>

    <g transform="translate(270, 40)">
      <rect x="0" y="0" width="115" height="42" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="57" y="18" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">search_agent</text>
      <text x="57" y="33" font-size="9" text-anchor="middle" fill="#94a3b8">메타 검색</text>
    </g>

    <g transform="translate(395, 40)">
      <rect x="0" y="0" width="115" height="42" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="57" y="18" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">summary_agent</text>
      <text x="57" y="33" font-size="9" text-anchor="middle" fill="#94a3b8">요약 · 통계</text>
    </g>

    <g transform="translate(520, 40)">
      <rect x="0" y="0" width="115" height="42" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="57" y="18" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">guide_agent</text>
      <text x="57" y="33" font-size="9" text-anchor="middle" fill="#94a3b8">사용 안내</text>
    </g>

    <g transform="translate(645, 40)">
      <rect x="0" y="0" width="115" height="42" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="57" y="18" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">general_agent</text>
      <text x="57" y="33" font-size="9" text-anchor="middle" fill="#94a3b8">일반 대화</text>
    </g>

    <g transform="translate(770, 40)">
      <rect x="0" y="0" width="90" height="42" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="45" y="18" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">selector</text>
      <text x="45" y="33" font-size="9" text-anchor="middle" fill="#94a3b8">선택</text>
    </g>
  </g>

  <!-- Arrow down -->
  <line x1="500" y1="500" x2="500" y2="540" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-pipeline)"/>

  <!-- ============ External Systems ============ -->
  <!-- LLM -->
  <g transform="translate(60, 545)">
    <rect x="0" y="0" width="270" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="20" y="30" font-size="11" font-weight="700" fill="#991b1b" letter-spacing="1.5">LLM (온프레미스)</text>
    <text x="20" y="56" font-size="16" font-weight="700" fill="#0f172a">GPT-OSS · Qwen</text>
    <text x="20" y="78" font-size="12" fill="#64748b">사내 GPU 서버</text>
    <text x="20" y="95" font-size="12" fill="#64748b">고객사 온프레미스 설치</text>
    <line x1="20" y1="108" x2="250" y2="108" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="128" font-size="11" fill="#64748b">· OpenAI 호환 API</text>
    <text x="20" y="143" font-size="11" fill="#64748b">· LLM 호출 추상화 레이어</text>
  </g>

  <!-- Vector Store -->
  <g transform="translate(365, 545)">
    <rect x="0" y="0" width="270" height="150" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="20" y="30" font-size="11" font-weight="700" fill="#854d0e" letter-spacing="1.5">벡터 + 인덱스 스토어</text>
    <text x="20" y="56" font-size="16" font-weight="700" fill="#0f172a">FAISS · Milvus</text>
    <text x="20" y="78" font-size="12" fill="#64748b">SentenceTransformer</text>
    <text x="20" y="95" font-size="12" fill="#64748b">자체 InvertedIndex</text>
    <line x1="20" y1="108" x2="250" y2="108" stroke="#fde68a" stroke-width="1"/>
    <text x="20" y="128" font-size="11" fill="#64748b">· G-MATRIX 사내 임베딩 모델</text>
    <text x="20" y="143" font-size="11" fill="#64748b">· Pickle 캐시 (콜드스타트 대응)</text>
  </g>

  <!-- RDBMS -->
  <g transform="translate(670, 545)">
    <rect x="0" y="0" width="270" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="30" font-size="11" font-weight="700" fill="#1e3a8a" letter-spacing="1.5">데이터 소스</text>
    <text x="20" y="56" font-size="16" font-weight="700" fill="#0f172a">RDBMS · BI Engine</text>
    <text x="20" y="78" font-size="12" fill="#64748b">기존 AUD 리포트 자산</text>
    <text x="20" y="95" font-size="12" fill="#64748b">메타데이터 · SQL 템플릿</text>
    <line x1="20" y1="108" x2="250" y2="108" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="128" font-size="11" fill="#64748b">· 사전 정의 SQL 바인딩</text>
    <text x="20" y="143" font-size="11" fill="#64748b">· 동적 SQL 실행</text>
  </g>
</svg>
